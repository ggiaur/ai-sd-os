[pytest]
# All real tests here are function-based (`def test_*`), never class-based —
# so the only classes matching pytest's default `Test*` discovery prefix are
# production classes that happen to be named that way (TestRunnerAgent,
# TestsFailedPayload). Narrowing python_classes stops pytest from trying to
# collect them and warning about their __init__ constructors.
python_classes = NoClassBasedTestsUsedInThisProject
